# ==========================================
# 1. ConfigMap & Secret for Application & DB Initialization
# ==========================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    app: task-management
data:
  APP_ENV: "development"
  DB_HOST: "database"
  DB_PORT: "5432"
  DB_NAME: "taskdb"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  labels:
    app: task-management
type: Opaque
stringData:
  DB_USER: "taskuser"
  DB_PASSWORD: "taskpassword"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-configmap
  labels:
    app: task-management
data:
  schema.sql: |
    -- Create tasks table if it does not exist
    CREATE TABLE IF NOT EXISTS tasks (
        id SERIAL PRIMARY KEY,
        title VARCHAR(255) NOT NULL,
        description TEXT,
        status VARCHAR(50) NOT NULL DEFAULT 'TODO' CHECK (status IN ('TODO', 'IN_PROGRESS', 'DONE')),
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Trigger to automatically update updated_at timestamp on row update
    CREATE OR REPLACE FUNCTION update_timestamp()
    RETURNS TRIGGER AS $$
    BEGIN
       NEW.updated_at = CURRENT_TIMESTAMP;
       RETURN NEW;
    END;
    $$ language 'plpgsql';

    DROP TRIGGER IF EXISTS update_tasks_timestamp ON tasks;
    CREATE TRIGGER update_tasks_timestamp
    BEFORE UPDATE ON tasks
    FOR EACH ROW
    EXECUTE FUNCTION update_timestamp();

    -- Insert sample initial tasks for testing and demonstration
    INSERT INTO tasks (title, description, status) VALUES
    ('Initialize Repository', 'Set up GitHub repository structure with frontend, backend, and database directories.', 'DONE'),
    ('Configure Docker Compose', 'Define multi-container network, persistent named volume, and environment variables.', 'DONE'),
    ('Deploy to Kubernetes', 'Orchestrate pods, deployments, services, and volume claims using k8s manifests.', 'IN_PROGRESS');
